[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2bop-repro"
version = "0.1.0"
description = "Reproducible validation package for a bounded green-hydrogen compressor benchmark"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio project"}]
dependencies = []

[project.scripts]
h2bop-repro = "h2bop_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
